<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org"
th:replace="~{base::layout(~{::main})}">

<body>

<main>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0 rounded-4 login-card">

                <div class="card-header bg-primary text-white text-center py-4">
                    <h2><i class="fa-solid fa-right-to-bracket me-2"></i>Login</h2>
                    <p class="mb-0">Welcome Back to StudyNova</p>
                </div>

<div class="text-center mt-4">
    <img th:src="@{/images/image5.png}"
         class="img-fluid login-img"
         style="max-height:200px;"
         alt="Login Illustration">
</div>

                <div class="card-body p-4">

                    <form th:action="@{/login}" method="post">

                      


<div class="mb-3">
    <label class="form-label fw-semibold">
        <i class="fa-solid fa-envelope text-primary me-2"></i>Email Address
    </label>

    <input type="email"
           class="form-control form-control-lg login-input"
           name="username"
           placeholder="Enter your email"
           required>
</div>


                       <div class="mb-3">

    <label class="form-label fw-semibold">
        <i class="fa-solid fa-lock text-primary me-2"></i>Password
    </label>

    <div class="input-group">

        <input type="password"
               class="form-control form-control-lg login-input"
               id="password"
               name="password"
               placeholder="Enter your password"
               required>

        <span class="input-group-text"
              onclick="togglePassword()"
              style="cursor:pointer;">

            <i class="fa-solid fa-eye" id="eyeIcon"></i>

        </span>

    </div>

</div>


                        <!--  <div class="d-flex justify-content-between mb-3">

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember">

                                <label class="form-check-label" for="remember">
                                    Remember Me
                                </label>
                            </div>

                            <a href="/ForgotPassword"
                               class="text-decoration-none">
                                Forgot Password?
                            </a>

                        </div>-->
                        
                        <div class="d-flex justify-content-between align-items-center mb-4">

    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember">

        <label class="form-check-label" for="remember">
            Remember Me
        </label>
    </div>

    <a href="/ForgotPassword"
       class="text-decoration-none fw-semibold forgot-link">
        Forgot Password?
    </a>

</div>

                        <div class="d-grid">

                            <button class="btn btn-primary btn-lg w-100 login-btn" type="submit">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Login
                            </button>

                        </div>

                    </form>

                    <hr>

                    <div class="text-center">

                        <p class="mb-0">
                            Don't have an account?

                           <a href="/Registration"
   class="text-decoration-none fw-bold register-link">
    Create New Account →
</a>


                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

var msg = "[[${msg}]]";
if (msg != "") {
	alert(msg);
}
	

	</script>
</main>


</body>
</html>
