<h1 class="fw-bold">6. ORDER BY & LIMIT</h1>

<p><b>ORDER BY</b> sorts records.</p>
<pre class="bg-dark text-white p-3 rounded">SELECT * FROM students
ORDER BY age ASC;</pre>

<p>Use <b>DESC</b> for descending order.</p>

<p><b>LIMIT</b> restricts the number of returned records.</p>
<pre class="bg-dark text-white p-3 rounded">SELECT * FROM students
LIMIT 5;</pre>
