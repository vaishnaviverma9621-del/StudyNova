<h1 class="fw-bold">9. SQL Joins</h1>

<p>Joins are used to combine data from two or more tables.</p>

<h4>Common Joins</h4>
<ul>
<li>INNER JOIN</li>
<li>LEFT JOIN</li>
<li>RIGHT JOIN</li>
</ul>

<pre class="bg-dark text-white p-3 rounded">SELECT students.name, courses.course_name
FROM students
INNER JOIN courses
ON students.course_id = courses.id;</pre>
