<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::main})}">

<body>

<main>
<div class="container mt-4" th:if="${successMessage}">
    <div class="alert alert-success text-center">
        <span th:text="${successMessage}"></span>
    </div>
</div>
<section class="bg-primary text-white text-center py-5 mb-5">
    <div class="container">
        <h1 class="fw-bold display-5">Contact StudyNova</h1>
        <p class="lead">
            We'd love to hear from you. Feel free to contact us anytime!
        </p>
    </div>
</section>



<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h2>Contact Us</h2>
                    <p class="mb-0">We'd love to hear from you!</p>
                </div>

                <div class="card-body p-4">

<div class="row align-items-center">

    <div class="col-lg-5 text-center mb-4 mb-lg-0">

        <img th:src="@{/images/image6.png}"
             class="img-fluid"
             style="max-height:300px;"
             alt="Contact">

    </div>

    <div class="col-lg-7">



                    <form th:action="@{/contact}" method="post">

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
    <span class="input-group-text">
        <i class="fa-solid fa-user"></i>
    </span>

    <input type="text"
    name="name"
           class="form-control"
           placeholder="Enter your name"
           required>
</div>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
    <span class="input-group-text">
        <i class="fa-solid fa-envelope"></i>
    </span>

    <input type="email"
    name="email"
           class="form-control"
           placeholder="Enter your email"
           required>
</div>

                        </div>

                        <!-- Course -->
                        <div class="mb-3">
                            <label class="form-label">Select Course</label>

               <select name="course" class="form-select" required>
    <option selected disabled value="">Select Course</option>
    <option>Java</option>
    <option>Python</option>
    <option>Web Development</option>
    <option>Spring Boot</option>
    <option>SQL</option>
    <option>C++</option>
</select>

                        </div>

                        <!-- Message -->
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                           

                            <textarea  name="message" class="form-control"
                                      rows="5"
                                      placeholder="Write your message here"
                                      required></textarea>
                        </div>

                        <!-- Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-5">
                                Send Message
                            </button>
                        </div>

                    </form>
</div>

</div>


                </div>

            </div>

        </div>

    </div>

</div>


<div class="container pb-5">

    <div class="row text-center g-4">

        <div class="col-md-4">
            <div class="card shadow border-0 p-4 h-100">
                <i class="fa-solid fa-location-dot fa-2x text-primary mb-3"></i>
                <h5>Address</h5>
                <p class="mb-0">Lucknow, Uttar Pradesh</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 p-4 h-100">
                <i class="fa-solid fa-envelope fa-2x text-danger mb-3"></i>
                <h5>Email</h5>
                <p class="mb-0">Contact us through the form above</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0 p-4 h-100">
                <i class="fa-solid fa-phone fa-2x text-success mb-3"></i>
                <h5>Phone</h5>
               <p class="mb-0">Available through Contact Form</p>
            </div>
        </div>

    </div>

</div>

<div class="container pb-5">

    <h2 class="text-center fw-bold mb-4">
        Find Us Here
    </h2>

    <iframe
        src="https://www.google.com/maps?q=Lucknow&output=embed"
        width="100%"
        height="350"
        style="border:0; border-radius:20px;"
        allowfullscreen=""
        loading="lazy">
    </iframe>

</div>


</main>

</body>
</html>
