<h1 class="fw-bold">3. SELECT Statement</h1>

<p>The SELECT statement is used to retrieve data from a table.</p>

<h4>Examples</h4>

<pre class="bg-dark text-white p-3 rounded">SELECT * FROM students;

SELECT name FROM students;

SELECT name, age FROM students;</pre>

<p>The <b>*</b> symbol selects all columns.</p>
